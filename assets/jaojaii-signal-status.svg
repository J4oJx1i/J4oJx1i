<svg xmlns="http://www.w3.org/2000/svg" width="620" height="84" viewBox="0 0 620 84" role="img" aria-label="JAOJAII Creative Universe — Signal Online">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#101329"/>
    <stop offset=".5" stop-color="#1E1B4B"/>
    <stop offset="1" stop-color="#101329"/>
  </linearGradient>
  <linearGradient id="outline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#766AE1"/>
    <stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
</defs>
<!-- Equal 2px framing on all four sides -->
<rect x="2" y="2" width="616" height="80" rx="19" fill="url(#bg)" stroke="#8175D7" stroke-width="2"/>
<!-- Mark -->
<circle cx="64" cy="42" r="18" fill="#2A245F" stroke="#A78BFA" stroke-width="2"/>
<circle cx="64" cy="42" r="7" fill="#C4B5FD">
  <animate attributeName="opacity" values=".65;1;.65" dur="3s" repeatCount="indefinite"/>
</circle>
<!-- Brand -->
<text x="108" y="38" fill="#FFFFFF" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1.5">JAOJAII</text>
<text x="108" y="59" fill="#B8B5E8" font-size="13" font-family="Arial,Helvetica,sans-serif" letter-spacing="2">CREATIVE UNIVERSE</text>
<!-- Inset pill has consistent vertical centering and right inset -->
<rect x="388" y="20" width="200" height="44" rx="22" fill="#272353" stroke="url(#outline)" stroke-width="1.7"/>
<circle cx="413" cy="42" r="6" fill="#B79BFF"/>
<text x="433" y="47.5" fill="#F4F0FF" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing=".35">SIGNAL ONLINE</text>
</svg>